            // Corner points
            deedCoords.forEach(d => {
                d.points.forEach(pt => {
                    const s = toSVGCoord(pt);
                    svgContent += `  <circle cx="${s.x}" cy="${s.y}" r="4" stroke="#ff6600" fill="#ff8800" fill-opacity="0.6" stroke-width="1"/>\n`;
                });
            });

            // Centroid labels
            deedCoords.forEach(d => {
                if (d.centroid && d.labelText) {
                    const s = toSVGCoord(d.centroid);
                    const textLines = d.labelText.replace(/<br\s*\/?>/gi, '\n').split('\n');
                    const lineHeight = 13;
                    const totalHeight = textLines.length * lineHeight;
                    const startY = s.y - totalHeight / 2 + lineHeight / 2;

                    // Background rect
                    const maxLen = Math.max(...textLines.map(t => t.length));
                    const rectW = maxLen * 7 + 12;
                    const rectH = totalHeight + 6;
                    svgContent += `  <rect x="${s.x - rectW/2}" y="${s.y - rectH/2}" width="${rectW}" height="${rectH}" rx="3" fill="white" fill-opacity="0.75"/>\n`;

                    // Text
                    svgContent += `  <text x="${s.x}" y="${startY}" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">\n`;
                    textLines.forEach((line, i) => {
                        svgContent += `    <tspan x="${s.x}" dy="${i === 0 ? 0 : lineHeight}">${line.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</tspan>\n`;
                    });
                    svgContent += `  </text>\n`;
                }
            });

            const svg = `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="${svgWidth}" height="${svgHeight}" viewBox="0 0 ${svgWidth} ${svgHeight}">
  <rect width="100%" height="100%" fill="#f8f8f8"/>
${svgContent}</svg>`;

            // Download
            const blob = new Blob([svg], { type: 'image/svg+xml' });
            const link = document.createElement('a');
            link.download = loadedFileName + '.svg';
            link.href = URL.createObjectURL(blob);
            link.click();
            URL.revokeObjectURL(link.href);
        }

        document.getElementById('exportBtn').onclick = exportSVG;

        // Export Map Region: expand map to 3x3 viewport area, capture, restore
        async function exportMapRegion() {
            if (!mainMap) return alert('No map to export');

            const mapEl = document.getElementById('map');
            const container = document.getElementById('container');
            const size = mainMap.getSize(); // current {x: width, y: height}
            const originalCenter = mainMap.getCenter();
            const originalZoom = mainMap.getZoom();
            const bounds = mainMap.getBounds();
            const latSpan = bounds.getNorth() - bounds.getSouth();
            const lngSpan = bounds.getEast() - bounds.getWest();

            const gridRadius = 1; // 1 = 3x3, future: configurable
            const gridSize = 2 * gridRadius + 1;

            // Progress indicator
            const progressDiv = document.createElement('div');
            progressDiv.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.8);color:white;padding:20px 30px;border-radius:8px;z-index:9999;font-size:16px;';
            progressDiv.textContent = 'Preparing export...';
            document.body.appendChild(progressDiv);

            // Disable interaction
            mainMap.dragging.disable();
            mainMap.scrollWheelZoom.disable();
            mainMap.doubleClickZoom.disable();

            // Save original map container styles
            const origMapStyle = mapEl.style.cssText;
            const origContainerStyle = container.style.cssText;

            // Expand the map container to 3x size, keeping same zoom and center
            const exportWidth = size.x * gridSize;
            const exportHeight = size.y * gridSize;

            container.style.cssText = 'position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:-1;';
            mapEl.style.cssText = `position:fixed; top:0; left:0; width:${exportWidth}px; height:${exportHeight}px; z-index:-1;`;

            // Tell Leaflet about the new size
            mainMap.invalidateSize();
            mainMap.setView(originalCenter, originalZoom, { animate: false });

            // Fully redraw all plot layers so SVG pane recalculates for new container size
            drawOnMap(getVisibleFilteredDeeds(), mainMap, false, true);

            // Wait for tiles and rendering
            await new Promise(resolve => {
                function onReady() {
                    setTimeout(resolve, 1500); // extra time for all tiles and vectors to render
                }
                if (basemapLayer) {
                    mainMap.once('idle', onReady);
                    setTimeout(resolve, 6000); // fallback
                } else {
                    setTimeout(resolve, 1000);
                }
            });

            progressDiv.textContent = 'Capturing map...';

            try {
                // Capture the expanded map with html2canvas
                const capturedCanvas = await html2canvas(mapEl, {
                    useCORS: true,
                    allowTaint: true,
                    logging: false,
                    width: exportWidth,
                    height: exportHeight,
                    scrollX: 0,
                    scrollY: 0,
                    x: 0,
                    y: 0,
                    windowWidth: exportWidth,
                    windowHeight: exportHeight
                });

                progressDiv.textContent = 'Generating image...';

                // Export as PNG
                capturedCanvas.toBlob(blob => {
                    const link = document.createElement('a');
                    link.download = loadedFileName + '_region.png';
                    link.href = URL.createObjectURL(blob);
                    link.click();
                    URL.revokeObjectURL(link.href);
                    progressDiv.remove();
                }, 'image/png');

            } catch (err) {
                alert('Export error: ' + err.message);
                progressDiv.remove();
            } finally {
                // Restore original map container
                container.style.cssText = origContainerStyle;
                mapEl.style.cssText = origMapStyle;
                mainMap.invalidateSize();
                mainMap.setView(originalCenter, originalZoom, { animate: false });

                // Redraw plots at original size so SVG pane is correct
                drawOnMap(getVisibleFilteredDeeds(), mainMap, false, true);

                // Re-enable interaction
                mainMap.dragging.enable();
                mainMap.scrollWheelZoom.enable();
                mainMap.doubleClickZoom.enable();
            }
        }

        document.getElementById('exportRegionBtn').onclick = exportMapRegion;

        // Modal with info
        function showSinglePlot(index) {
            const deed = deedsData[index];
            if (!deed) return;

            document.getElementById('modal').style.display = 'block';
            document.getElementById('modalInfo').innerHTML = getDeedTooltip(deed).replace(/<br>/g, '<br>');

            if (!modalMap) modalMap = L.map('modalMap', { crs: L.CRS.Simple, minZoom: -10, maxZoom: 18 });
            modalMap.eachLayer(l => modalMap.removeLayer(l));

            drawOnMap([deed], modalMap, true);

            // Highlight the single plot in modal
            highlightPlot(deed);
        }

        document.getElementById('closeModal').onclick = () => {
            document.getElementById('modal').style.display = 'none';
            // No need to revert in modal since it's closed
        };
    </script>
